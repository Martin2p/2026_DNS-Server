server:
  # Wireguard Interface, access etc.
  interface: 10.100.0.2
  access-control: 10.100.0.0/24 allow
  port: 53
  verbosity: 2

  # Socket-Buffer-Warnungen unterdrücken
  so-sndbuf: 0
  so-rcvbuf: 0
    
  # DNSSEC
  auto-trust-anchor-file: /usr/local/unbound/root.key

  # DoT Upstream
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

  # Caching
  cache-min-ttl: 3600
  cache-max-ttl: 86400

  # Performance
  num-threads: 2
  so-reuseport: yes

  # Privacy
  qname-minimisation: yes
  aggressive-nsec: yes

  # Logging nach stdout
  use-syslog: no
  logfile: ""

forward-zone:
  name: "."
  forward-tls-upstream: yes
  # Mullvad DNS (Schweden) - Primary
  forward-addr: 194.242.2.9@853
  forward-addr: 194.242.2.3@853
  forward-addr: 2a07:e340::fe9@853
  # Quad9 (Schweiz) - Secondary
  forward-addr: 9.9.9.9@853
  forward-addr: 149.112.112.112@853
  forward-addr: 2620:fe::fe@853
  forward-addr: 2620:fe::9@853

remote-control:
    control-enable: yes
    control-interface: 10.100.0.2
    control-port: 8953
    server-key-file: "/opt/unbound/certs/unbound_server.key"
    server-cert-file: "/opt/unbound/certs/unbound_server.pem"
    control-key-file: "/opt/unbound/certs/unbound_control.key"
    control-cert-file: "/opt/unbound/certs/unbound_control.pem"

